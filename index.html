<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק לימוד ספרדית</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>לימוד ספרדית</h1>
        <div id="controls">
            <label for="level-select">בחר רמה:</label>
            <select id="level-select">
                <option value="1">רמה 1 - בסיס</option>
                <option value="2">רמה 2 - אנשים ומקומות</option>
                <option value="3">רמה 3 - פעלים</option>
                <option value="4">רמה 4 - טיולים</option>
                <option value="5">רמה 5 - שמות תואר</option>
            </select>
        </div>
        <div id="game-board">
            <div class="column" id="hebrew-column">
                <h2>עברית</h2>
            </div>
            <div class="column" id="spanish-column">
                <h2>ספרדית</h2>
            </div>
        </div>
        <div id="status-message"></div>
    </div>
    <script src="words.js"></script>
    <script src="script.js"></script>
</body>
</html>
